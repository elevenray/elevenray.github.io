name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      # This repo (the source) stays private. dist/ — the built,
      # already-public-once-served site — gets pushed to a separate public
      # repo (named elevenray.github.io) whose only job is to be a GitHub
      # Pages target. See README.md for the one-time setup this depends on.
      - uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: elevenray/elevenray.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
